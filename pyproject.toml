[project]
name = "magnav"
version = "0.1.0"
description = "Quantum-assisted magnetic anomaly navigation demo (Qollab x IonQ Hackathon)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.15"
dependencies = [
    "qiskit>=2.5.2,<3.0.0",
    "numpy>=2.4,<2.5",
    "scipy>=1.18,<1.19",
    "scikit-learn>=1.8,<1.9",
]

[dependency-groups]
dev = [
    "qiskit-aer==0.17.2",
    "qiskit-ionq==1.1.1",
    "matplotlib>=3.10,<3.11",
    "pytest>=9.1",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
